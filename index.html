<head>

    <title>SevenClub</title>
    <style>
        body {
            background-color: rgb(27, 26, 26);
            margin: 0;

        .main {
            position: relative;
            width: 100%;
            height: 600px;
            margin: 0;
            background-image: 
                linear-gradient(to bottom, rgba(0, 0, 0, 0.8), transparent 150px), 
                url(klub1.jpg);
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
        }

        
        .main nav {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            margin-top:20px;
        }

        .main nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 50px;
            margin: 0;
            padding: 0;
        }

        .main nav a {
            text-decoration: none;
            color: rgba(240, 255, 255, 0.815);
            font-size: larger;
            font-weight: 800;
        }

        .main nav a:hover,
        .main nav a.active {
            color: rgba(240, 255, 255, 0.959);
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
        }

        h1 {
            color: chartreuse;
            text-align: center;
            margin-top: 0px;
            position: absolute;
        }
        hr{
           color: chartreuse;
           background-color: chartreuse;
           



        }
        .slogan{
            text-align: center;
            color: grey;
            font-weight: bolder;
            font-size:100px;

            position: absolute;
            gap: 51px;
            
            



        }
