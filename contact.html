<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact</title>
    <link rel="icon" type="image/x-icon" href="favicon.jpg" />
    <style>
      body {
        background-color: rgb(27, 26, 26);
        margin: 0;
        font-family: Georgia, "Times New Roman", Times, serif;
      }
      .main nav {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        margin-top: 20px;
      }

      .main nav ul {
        list-style: none;
        display: flex;
        justify-content: center;
        gap: 50px;
        margin: 0;
        padding: 0;
      }

      .main nav a {
        text-decoration: none;
        color: rgba(240, 255, 255, 0.815);
        font-size: larger;
        font-weight: 800;
      }

      .main nav a:hover,
      .main nav a.active {
        color: rgba(240, 255, 255, 0.959);
        text-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
      }

      h1 {
        margin-left: 5px;
        color: chartreuse;
        text-align: center;
        margin-top: 0px;
        position: absolute;
        top: 0;
        left: 0;
      }
      .blocek {
        height: 400px;
        width: 300px;
        background-color: rgb(41, 40, 40);
        margin: 5px;
        border-radius: 15px;
        border: 5px;
        border-style: solid;
        border-color: chartreuse;
        font-weight: 800;
        font-family: Georgia, "Times New Roman", Times, serif;
        color: rgba(240, 255, 255, 0.815);
        text-align: center;
        font-size: larger;
        line-height: 2;
        padding: 5px;
      }
      hr {
        color: chartreuse;
        background-color: chartreuse;
        height: 10px;
        margin: 0;
        border-color: black;
        margin-top: 55px;
      }
      .uvod {
        text-align: center;
        color: rgba(240, 255, 255, 0.815);
        font-weight: bolder;
        font-size: larger;
        font-family: Georgia, "Times New Roman", Times, serif;
        margin: 0;
      }
      .uvodbanner {
        margin-top: 20px;
        height: 60px;
        width: 800px;
        background-color: rgb(41, 40, 40);
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 25px;
        margin-left: 25%;
      }
      .kontakty {
        display: flex;
        justify-content: center;
        gap: 30px;
        margin-top: 50px;
      }
      .kontakt {
        width: 250px;
        background-color: rgb(41, 40, 40);
        border-radius: 15px;
        border: 5px;
        border-style: solid;
        border-color: chartreuse;
        font-weight: 800;
        font-family: Georgia, "Times New Roman", Times, serif;
        color: rgba(240, 255, 255, 0.815);
        text-align: center;
        font-size: larger;
        line-height: 2;
        padding: 15px;
      }
      .kontakt h2 {
        color: chartreuse;
        margin: 0;
      }
      .kontakt span:hover {
        color: rgba(240, 255, 255, 0.959);
        text-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
      }
    </style>

  <body>
    <div class="main">
      <nav class="site-nav" aria-label="Primary">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="hours.html">Opening hours</a></li>
          <li><a href="location.html">Location</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
      <h1>SevenClub</h1>
    </div>
    <hr />
    <div class="uvodbanner">
      <p class="uvod">
        Need more information or have questions? Feel free to reach out to us!
      </p>
    </div>
    <div class="kontakty">
      <div class="kontakt">
        <h2>Email</h2>
        <span>info@7club.cz</span>
      </div>
      <div class="kontakt">
        <h2>Phone</h2>
        <span>+420 656 235 202</span>
      </div>
      <div class="kontakt">
        <h2>Instagram</h2>
        <span>7club.czechia</span>
      </div>
    </div>
    <div class="uvodbanner" style="margin-top: 50px">
      <p class="uvod">
        Planning a private event? Contact us by email at info@7club.cz!
      </p>
    </div>

</html>
